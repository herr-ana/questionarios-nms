
<!doctype html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Questionários — Crianças e adolescentes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="card">

        <a class="back" href="index.html">← Voltar</a>

        <div class="eyebrow">
            Portal das crianças e adolescentes
        </div>

        <h1>Os teus questionários</h1>

        <p>
            Escolhe a tua idade em anos completos para
            veres os questionários que deves preencher.
        </p>

        <label for="idade">Idade</label>

        <select id="idade">
            <option value="">Seleciona a idade</option>
        </select>

        <section id="resultados" aria-live="polite"></section>

        <p class="note">
            Se precisares de ajuda, pede apoio ao adulto
            ou investigador responsável. Lê as instruções
            e o consentimento de cada questionário.
        </p>

    </main>

    <script>

        // QUESTIONÁRIOS POR ORDEM DE APRESENTAÇÃO

        const items = [

            // 1. CLINIC — SEMPRE PRIMEIRO

            {
                name: 'Questionário sobre Hábitos de Vida e Saúde (CLINIC) - Crianças',
                min: 8,
                max: 11,
                platform: 'Tally',
                url: 'https://tally.so/r/1WW9Vl'
            },

            {
                name: 'Questionário sobre Hábitos de Vida e Saúde (CLINIC) - Adolescentes',
                min: 12,
                max: 17,
                platform: 'Tally',
                url: 'https://tally.so/r/xVVJJ5'
            },

            // 2. CASSS — SEGUNDO

            {
                name: 'Questionário sobre Apoio Social (CASSS)',
                min: 8,
                max: 11,
                platform: 'Microsoft Forms',
                url: 'https://forms.cloud.microsoft/e/vtvPmZyfM2'
            },

            {
                name: 'Questionário sobre Apoio Social (CASSS)',
                min: 12,
                max: 17,
                platform: 'Microsoft Forms',
                url: 'https://forms.cloud.microsoft/e/TfiKZe6auR'
            },

            // 3. SDQ — TERCEIRO

            {
                name: 'Questionário sobre Emoções e Comportamentos (SDQ)',
                min: 11,
                max: 17,
                platform: 'Microsoft Forms',
                url: 'https://forms.cloud.microsoft/e/n7xr0utHWA'
            }

        ];

        // ELEMENTOS DA PÁGINA

        const select = document.querySelector('#idade');
        const out = document.querySelector('#resultados');

        // CRIAR OPÇÕES DE IDADE (8 A 17 ANOS)

        for (let n = 8; n <= 17; n++) {

            const opt = document.createElement('option');

            opt.value = n;
            opt.textContent = n + ' anos';

            select.appendChild(opt);
        }

        // MOSTRAR QUESTIONÁRIOS CORRESPONDENTES

        select.addEventListener('change', () => {

            const n = Number(select.value);

            out.replaceChildren();

            if (!select.value) return;

            const list = items.filter(
                x => n >= x.min && n <= x.max
            );

            const heading = document.createElement('h2');

            heading.textContent =
                'Questionários para ' + n + ' anos';

            out.appendChild(heading);

            const ol = document.createElement('ol');

            ol.className = 'forms';

            for (const x of list) {

                const li = document.createElement('li');
                const info = document.createElement('div');
                const strong = document.createElement('strong');
                const small = document.createElement('small');
                const a = document.createElement('a');

                strong.textContent = x.name;
                small.textContent = x.platform;

                info.append(strong, small);

                a.href = x.url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.textContent = 'Abrir ↗';

                li.append(info, a);
                ol.appendChild(li);
            }

            out.appendChild(ol);
        });

    </script>

</body>
</html>
